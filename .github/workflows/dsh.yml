name: DSH integration

on:
  pull_request:
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh.yml'
      - 'archify/renderers/shared/atomic-output.mjs'
      - 'archify/renderers/shared/output-path.mjs'
      - 'archify/renderers/shared/path-semantics.mjs'
      - 'archify/renderers/shared/portable-path.mjs'
      - 'archify/renderers/shared/sidecar-path.mjs'
      - 'scripts/stage-clean-skill.mjs'
      - 'scripts/third-party-notices-contract.mjs'
  push:
    branches: [main, dev]
    paths:
      - 'integrations/deepseek-harness/**'
      - '.github/workflows/dsh.yml'
      - 'archify/renderers/shared/atomic-output.mjs'
      - 'archify/renderers/shared/output-path.mjs'
      - 'archify/renderers/shared/path-semantics.mjs'
      - 'archify/renderers/shared/portable-path.mjs'
      - 'archify/renderers/shared/sidecar-path.mjs'
      - 'scripts/stage-clean-skill.mjs'
      - 'scripts/third-party-notices-contract.mjs'
    tags:
      - 'archify-dsh-v*'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      adapter_release:
        description: 'Run the three-platform adapter release gate'
        type: boolean
        default: false

# A tag re-run must not abort an in-flight publish. npm will not accept the
# same version again; the publish job repairs a missing release record instead.
concurrency:
  group: dsh-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  contract:
    name: DSH package contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Static adapter contracts
        run: node --test integrations/deepseek-harness/test/*.test.mjs

  distribution-acceptance:
    name: DSH distribution acceptance
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - name: Real tarball install, discovery, package-smoke, uninstall
        run: node integrations/deepseek-harness/scripts/distribution-acceptance.mjs

  adapter-release:
    name: adapter release (${{ matrix.os }})
    needs: contract
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.adapter_release
      || startsWith(github.ref, 'refs/tags/archify-dsh-v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10
      - name: Adapter staging regressions on the release host
        run: node --test integrations/deepseek-harness/test/adapter-staging.test.mjs
        shell: bash
      - name: Real DSH distribution acceptance
        run: node integrations/deepseek-harness/scripts/distribution-acceptance.mjs
        shell: bash

  publish:
    name: publish to npm
    needs: [contract, adapter-release]
    if: startsWith(github.ref, 'refs/tags/archify-dsh-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      # Trusted publishing needs an npm CLI that performs the OIDC exchange.
      - name: Use an npm CLI with trusted publishing
        run: |
          npm install --global npm@^11.5.1
          npm --version
      - name: Require the tag to match the package version
        run: |
          version=$(node -p "require('./integrations/deepseek-harness/package.json').version")
          test "${GITHUB_REF_NAME}" = "archify-dsh-v${version}"
      - name: Pack the tested tarball
        run: node integrations/deepseek-harness/scripts/pack.mjs --out "$RUNNER_TEMP/archify-dsh.tgz" --json > "$RUNNER_TEMP/pack.json"
      # No NODE_AUTH_TOKEN and no .npmrc token: npm exchanges the OIDC identity
      # for a short-lived credential issued to the configured trusted publisher.
      # The same version cannot be published twice. If it is already on the
      # registry, continue so a rerun can still record the GitHub Release.
      - name: Publish with trusted publishing
        run: |
          version=$(node -p "require('./integrations/deepseek-harness/package.json').version")
          npm publish "$RUNNER_TEMP/archify-dsh.tgz" --access public && exit 0
          status=$?
          published=$(npm view "@tt-a1i/archify-dsh@${version}" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "@tt-a1i/archify-dsh@${version} is already on the registry; recording the release"
            exit 0
          fi
          exit "$status"
      - name: Record the release and verified tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_name="tt-a1i-archify-dsh.tgz"
          tarball="$RUNNER_TEMP/archify-dsh.tgz"
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' 2>/dev/null); then
            echo "release $GITHUB_REF_NAME already exists"
            if ! printf '%s\n' "$assets" | grep -Fxq "$asset_name"; then
              gh release upload "$GITHUB_REF_NAME" "${tarball}#${asset_name}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              "${tarball}#${asset_name}" \
              --verify-tag \
              --latest=false \
              --title "Archify DSH ${GITHUB_REF_NAME#archify-dsh-v}" \
              --notes "Published \`@tt-a1i/archify-dsh\` from this tag's verified tarball. See the integration README for the bundled Archify source and acceptance record."
          fi
